# 多平台打包：推送 v* 标签 → 构建各平台安装包并发布 Release
# 也可在 Actions 页面手动触发（此时产物以上传的 workflow artifact 形式提供）。
#
# 说明：产物运行时仍需系统装有 python3（backend.py 以子进程方式运行），
#       backend.py / core.py 已作为资源随包分发，无需额外安装。

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # 用较老的 LTS 构建，glibc 兼容面更大
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 依赖 node:sqlite（Node 22.13+ 才内置）

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sliceforge-tauri/src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: 安装前端依赖
        run: pnpm install
        working-directory: sliceforge-tauri

      - name: 构建并发布（tag 触发 → 创建草稿 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: sliceforge-tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('SliceForge {0}', github.ref_name) || '' }}
          releaseBody: '请在下方 Assets 选择对应平台安装包。运行依赖系统 python3（backend.py 以子进程方式执行）。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传构建产物（非 tag 的手动触发）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ strategy.job-index }}
          # macOS 矩阵带了 --target <triple>，其产物落在 target/<triple>/release 下，
          # 因此除默认 target/release 路径外，再补一条 *-apple-darwin 的匹配。
          path: |
            sliceforge-tauri/src-tauri/target/release/bundle/deb/*.deb
            sliceforge-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            sliceforge-tauri/src-tauri/target/release/bundle/msi/*.msi
            sliceforge-tauri/src-tauri/target/release/bundle/nsis/*.exe
            sliceforge-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            sliceforge-tauri/src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

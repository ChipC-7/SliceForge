# 多平台打包：推送 v* 标签 → 构建各平台安装包并发布 Release
# 也可在 Actions 页面手动触发（此时产物以上传的 workflow artifact 形式提供）。
#
# 说明：产物运行时仍需系统装有 python3（backend.py 以子进程方式运行），
#       backend.py / core.py 已作为资源随包分发，无需额外安装。
# 注意：应用显示名「切片工坊」含非 ASCII 字符，Windows 只打 NSIS（WiX 的
#       light.exe 不支持非 ASCII 路径），Release 资产不经 tauri-action 上传
#       （它会把中文资产名清洗为下划线），由独立 publish 任务统一发布。

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # 用较老的 LTS 构建，glibc 兼容面更大
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 依赖 node:sqlite（Node 22.13+ 才内置）

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sliceforge-tauri/src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: 安装前端依赖
        run: pnpm install
        working-directory: sliceforge-tauri

      - name: 构建安装包
        run: pnpm tauri build ${{ matrix.args }}
        working-directory: sliceforge-tauri

      - name: 归集产物到单层目录（保证 artifact 内无嵌套路径）
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-bundles
          base="sliceforge-tauri/src-tauri/target/release/bundle"
          for d in deb rpm appimage nsis dmg; do
            for f in "$base/$d"/*; do
              cp "$f" dist-bundles/
            done
          done
          # macOS 矩阵带了 --target <triple>，产物在 target/<triple>/release 下
          for f in sliceforge-tauri/src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg; do
            cp "$f" dist-bundles/
          done
          ls -lh dist-bundles/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ strategy.job-index }}
          if-no-files-found: error
          path: dist-bundles/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部平台产物（保留中文文件名）
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true

      - name: 核对产物清单
        run: ls -lh artifacts/

      - name: 删除同名旧 Release（保留标签，便于失败重跑）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: SliceForge ${{ github.ref_name }}
          body: 请在下方 Assets 选择对应平台安装包。运行依赖系统 python3（backend.py 以子进程方式执行）。
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
